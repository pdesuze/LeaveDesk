<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LeaveDesk — HR Leave Manager</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23182233'/><circle cx='50' cy='54' r='20' fill='%233f6de0'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
(function(){try{
  var t=localStorage.getItem('leavedesk.theme');
  if(!t)t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
  document.documentElement.dataset.theme=t;
}catch(e){document.documentElement.dataset.theme='light'}})();
</script>
<style>
:root{
  color-scheme:light;
  --bg:#eef1f5; --surface:#ffffff; --surface-2:#f4f6f9;
  --line:#dbe1e9; --line-strong:#c6cfda;
  --text:#1a2432; --text-soft:#5c6b80;
  --header-bg:#182233; --header-accent:#2e5cd6; --hero-bg:#202c46;
  --accent-btn:#2e5cd6; --accent-text:#2e5cd6; --accent-soft:rgba(46,92,214,.15);
  --ink-btn:#1d2b41; --indicator:#7ea2f2;
  --track:#e4e9f0; --field-bg:#ffffff;
  --ok-bg:#e2f3e9; --ok-bd:#b3dfc4; --ok-tx:#136a3b; --ok-solid:#22a05d;
  --pend-bg:#fbf1d9; --pend-bd:#ecd49b; --pend-tx:#7d5600;
  --danger:#c8372d; --danger-bg:#fce9e6; --danger-bd:#f2bcb2; --danger-tx:#9e2b21;
  --warn-bg:#fff4d6; --warn-bd:#f4d98a; --warn-tx:#7d5600; --hol:#d9930d;
  --glow-a:rgba(46,92,214,.10); --glow-b:rgba(17,122,138,.08); --dot:rgba(26,36,50,.06);
  --shadow:0 14px 30px -20px rgba(24,34,51,.4); --shadow-sm:0 2px 8px -2px rgba(24,34,51,.22);
  --toast-bg:#182233;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --disp:'Bricolage Grotesque','IBM Plex Sans',sans-serif;
}
[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0c1118; --surface:#141b26; --surface-2:#1a2330;
  --line:#242f3f; --line-strong:#31405a;
  --text:#e6ebf3; --text-soft:#93a1b5;
  --header-bg:#0f1520; --header-accent:#3d67c4; --hero-bg:#17202f;
  --accent-btn:#3f6de0; --accent-text:#8aa8f0; --accent-soft:rgba(91,133,232,.2);
  --ink-btn:#2a3a52; --indicator:#7ea2f2;
  --track:#232e3f; --field-bg:#0f1621;
  --ok-bg:rgba(63,191,124,.13); --ok-bd:rgba(63,191,124,.38); --ok-tx:#6cd89e; --ok-solid:#2fae6e;
  --pend-bg:rgba(217,147,13,.14); --pend-bd:rgba(217,147,13,.42); --pend-tx:#e5b45c;
  --danger:#e05d50; --danger-bg:rgba(224,93,80,.13); --danger-bd:rgba(224,93,80,.42); --danger-tx:#ef8d82;
  --warn-bg:rgba(217,147,13,.14); --warn-bd:rgba(217,147,13,.42); --warn-tx:#e5b45c;
  --glow-a:rgba(72,110,220,.13); --glow-b:rgba(17,122,138,.10); --dot:rgba(255,255,255,.05);
  --shadow:0 16px 34px -20px rgba(0,0,0,.65); --shadow-sm:0 2px 10px -2px rgba(0,0,0,.5);
  --toast-bg:#202b3c;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'IBM Plex Sans',system-ui,sans-serif;color:var(--text);min-height:100vh;
  transition:background-color .3s ease,color .3s ease;
  background:
    radial-gradient(900px 480px at 88% -8%, var(--glow-a), transparent 60%),
    radial-gradient(760px 520px at -8% 34%, var(--glow-b), transparent 55%),
    radial-gradient(var(--dot) 1px, transparent 1.4px),
    var(--bg);
  background-size:auto,auto,22px 22px,auto;
}
::selection{background:var(--accent-btn);color:#fff}
button{font-family:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--text);background:var(--field-bg)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent-btn)!important;box-shadow:0 0 0 3px var(--accent-soft)}
#authScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:26px 18px}
.auth-theme{position:fixed;top:16px;right:16px;z-index:50;display:flex;align-items:center;gap:10px}
.auth-card{max-width:440px;width:100%;padding:30px;border-top:6px solid var(--indicator)}
.auth-brand{display:flex;align-items:center;gap:12px}
.auth-brand svg{filter:drop-shadow(2px 3px 0 rgba(0,0,0,.2))}
.auth-brand .brand-name{font-family:var(--disp);font-weight:800;font-size:24px;letter-spacing:-.01em;display:block}
.auth-brand .brand-co{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-soft);display:block;margin-top:3px}
.auth-err{margin:2px 0 10px;font-size:12.5px;color:var(--danger-tx);font-weight:500}
.auth-note{margin-top:18px;font-family:var(--mono);font-size:10.5px;color:var(--text-soft);text-align:center;line-height:1.7}
.auth-about{margin-top:8px;text-align:center;font-family:var(--mono);font-size:10.5px;line-height:1.8}
.auth-about a,.foot-about{color:var(--accent-text);text-decoration:none;border-bottom:1px dashed var(--accent-soft);cursor:pointer}
.auth-about a:hover,.foot-about:hover{border-bottom-style:solid}
.acct{display:flex;align-items:center;gap:9px;width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);cursor:pointer;transition:.15s;margin-top:6px;text-align:left}
.acct:hover{border-color:var(--accent-btn);transform:translateX(3px)}
.acct .an{font-weight:600;font-size:13px}
.acct .au{font-size:11px;color:var(--text-soft);font-family:var(--mono)}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.shake{animation:shake .4s}
.topbar{position:sticky;top:0;z-index:40;background:var(--header-bg);color:#e9eef6;background-image:radial-gradient(rgba(255,255,255,.05) 1px, transparent 1.4px);background-size:16px 16px;border-bottom:2px solid var(--header-accent);transition:background-color .3s ease}
.topbar-in{max-width:1180px;margin:0 auto;padding:14px 20px 0;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px}
.brand svg{flex:none;filter:drop-shadow(2px 3px 0 rgba(0,0,0,.3))}
.brand-name{font-family:var(--disp);font-weight:800;font-size:21px;letter-spacing:-.01em;line-height:1;display:block;color:#fff}
.brand-co{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#9db0c8;display:block;margin-top:3px}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.save-stamp{font-family:var(--mono);font-size:11px;color:#9db0c8;display:flex;align-items:center;gap:7px;margin-right:4px}
.save-stamp .dot{width:8px;height:8px;border-radius:50%;background:#4cc38a;animation:pulse 2.4s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(76,195,138,.5)}50%{box-shadow:0 0 0 6px rgba(76,195,138,0)}}
.userchip{display:flex;align-items:center;gap:8px;padding:5px 12px 5px 6px;border-radius:99px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);font-size:12.5px;font-weight:600;color:#fff}
.uc-role{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:#9db8f2;margin-left:2px}
.about-btn{width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;border:1.5px solid rgba(255,255,255,.25);background:rgba(255,255,255,.06);color:#9db0c8;cursor:pointer;font-family:var(--disp);font-weight:800;font-size:14px;font-style:italic;line-height:1;transition:.18s;flex:none}
.about-btn:hover{color:#fff;border-color:var(--indicator);background:rgba(126,162,242,.18);transform:translateY(-1px)}
.auth-theme .about-btn{background:var(--surface-2);border-color:var(--line-strong);color:var(--text-soft)}
.auth-theme .about-btn:hover{color:var(--accent-text);border-color:var(--accent-btn)}
.theme-switch{position:relative;display:flex;padding:3px;border-radius:99px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22)}
.theme-switch button{position:relative;z-index:1;width:30px;height:26px;border:none;background:none;color:#9db0c8;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:color .2s;border-radius:99px}
.theme-switch svg{width:14px;height:14px}
.ts-thumb{position:absolute;top:3px;left:3px;width:30px;height:26px;border-radius:99px;background:var(--indicator);transition:transform .28s cubic-bezier(.65,.05,.35,1);box-shadow:0 2px 6px rgba(0,0,0,.35)}
[data-theme="dark"] .ts-thumb{transform:translateX(30px)}
[data-theme="light"] [data-settheme="light"],[data-theme="dark"] [data-settheme="dark"]{color:#10161f}
.auth-theme .theme-switch{background:var(--surface-2);border-color:var(--line-strong)}
.auth-theme .theme-switch button{color:var(--text-soft)}
.auth-theme [data-theme="light"] [data-settheme="light"],.auth-theme [data-theme="dark"] [data-settheme="dark"]{color:#10161f}
.tbtn{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:9px;cursor:pointer;border:1.5px solid rgba(255,255,255,.28);background:rgba(255,255,255,.06);color:#e9eef6;font-weight:600;font-size:13px;transition:.18s}
.tbtn:hover{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.5);transform:translateY(-1px)}
.tbtn:active{transform:translateY(1px)}
.tbtn.primary{background:#3f6de0;color:#fff;border-color:#3f6de0;box-shadow:0 4px 12px -4px rgba(63,109,224,.6)}
.tbtn.primary:hover{background:#5581e8}
.nav{max-width:1180px;margin:0 auto;padding:12px 20px 0;display:flex;gap:4px;position:relative;overflow-x:auto}
.nav button{background:none;border:none;color:#9db0c8;font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;padding:10px 14px 14px;cursor:pointer;transition:.18s;white-space:nowrap;position:relative}
.nav button:hover{color:#fff}
.nav button.on{color:#fff}
.nav button .nb{display:inline-block;min-width:17px;padding:1px 5px;margin-left:6px;border-radius:99px;background:#e8a413;color:#241a03;font-size:10.5px;text-align:center;animation:pulse 2.4s infinite}
.tab-ind{position:absolute;bottom:0;height:3px;background:var(--indicator);border-radius:3px 3px 0 0;transition:transform .32s cubic-bezier(.65,.05,.35,1),width .32s cubic-bezier(.65,.05,.35,1)}
main{max-width:1180px;margin:0 auto;padding:26px 20px 90px}
.view{display:none}.view.on{display:block}
.grid-2{display:grid;grid-template-columns:1.05fr .95fr;gap:18px;margin-top:18px}
.stack{display:flex;flex-direction:column;gap:18px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;transition:background-color .3s ease,border-color .3s ease}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 18px;border-bottom:1px dashed var(--line)}
.panel-head h2{font-family:var(--disp);font-size:17px;font-weight:700;letter-spacing:-.01em}
.panel-body{padding:16px 18px}
.mono{font-family:var(--mono)}
.klabel{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-soft)}
.reveal{opacity:0;transform:translateY(14px);transition:opacity .5s ease,transform .5s ease,background-color .3s ease,border-color .3s ease}
.reveal.in{opacity:1;transform:none}
.hero{background:var(--hero-bg);color:#f2f6fb;border-radius:16px;padding:28px 30px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;border:1px solid var(--line);box-shadow:var(--shadow), inset 0 -4px 0 rgba(126,162,242,.4);background-image:repeating-linear-gradient(-45deg, rgba(255,255,255,.03) 0 2px, transparent 2px 14px);transition:background-color .3s ease}
.hero .kicker{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--indicator);margin-bottom:9px}
.hero h1{font-family:var(--disp);font-weight:800;font-size:clamp(26px,4vw,40px);letter-spacing:-.02em;line-height:1.05}
.hero .sub{margin-top:9px;color:#b6c3d8;font-size:14.5px;max-width:52ch}
.h-avs{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.av{width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff;border:2px solid rgba(255,255,255,.85);box-shadow:0 3px 8px rgba(0,0,0,.25);transition:transform .18s;flex:none}
.av:hover{transform:translateY(-3px) scale(1.06)}
.av-sm{width:32px;height:32px;font-size:11px;border-width:1.5px}
.av-lg{width:54px;height:54px;font-size:17px}
.h-chip{font-family:var(--mono);font-size:11px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);padding:6px 11px;border-radius:99px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-top:18px}
.tile{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:18px 18px 15px;box-shadow:var(--shadow-sm);transition:transform .2s,box-shadow .2s,background-color .3s ease,border-color .3s ease;overflow:hidden}
.tile::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--ac,var(--accent-btn))}
.tile:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.tile .klabel{display:block;margin-bottom:8px}
.tile b{font-family:var(--disp);font-weight:800;font-size:clamp(30px,3.4vw,42px);letter-spacing:-.02em;line-height:1;display:block}
.tile .hint{font-size:12px;color:var(--text-soft);margin-top:7px}
[data-tile]{cursor:pointer}
[data-tile]:active{transform:translateY(-1px) scale(.99)}
[data-tile]:focus-visible{outline:3px solid var(--accent-soft);outline-offset:2px}
.tile-hintgo{position:absolute;right:13px;bottom:11px;font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-text);opacity:0;transform:translateX(-6px);transition:.22s;pointer-events:none}
.tile:hover .tile-hintgo,.tile:focus-visible .tile-hintgo{opacity:1;transform:none}
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:9px;cursor:pointer;border:1.5px solid var(--line-strong);background:var(--surface);color:var(--text);font-weight:600;font-size:13.5px;box-shadow:var(--shadow-sm);transition:.16s}
.btn:hover{border-color:var(--text-soft);transform:translateY(-1px)}
.btn:active{transform:translateY(1px);box-shadow:none}
.btn-primary{background:var(--accent-btn);border-color:var(--accent-btn);color:#fff}
.btn-primary:hover{filter:brightness(1.1);border-color:var(--accent-btn)}
.btn-ink{background:var(--ink-btn);border-color:var(--ink-btn);color:#fff}
.btn-danger{border-color:var(--danger);color:var(--danger-tx)}
.btn-danger:hover{background:var(--danger-bg);border-color:var(--danger)}
.btn-reject-solid{background:var(--danger);border-color:var(--danger);color:#fff}
.btn-sm{padding:6px 11px;font-size:12.5px}
.icon-btn{width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;color:var(--text-soft);transition:.16s;flex:none}
.icon-btn:hover{border-color:var(--text-soft);color:var(--text);transform:translateY(-2px)}
.icon-btn.ok:hover{border-color:var(--ok-tx);color:var(--ok-tx);background:color-mix(in srgb, var(--ok-tx) 10%, transparent)}
.icon-btn.no:hover{border-color:var(--danger);color:var(--danger-tx);background:var(--danger-bg)}
.icon-btn svg{width:15px;height:15px}
.chip{font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:99px;border:1px solid var(--line);background:var(--surface-2);color:var(--text-soft)}
.chip.deleg{background:var(--pend-bg);border-color:var(--pend-bd);color:var(--pend-tx)}
.fchip{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:7px 13px;border-radius:99px;border:1.5px solid var(--line-strong);background:var(--surface);color:var(--text-soft);cursor:pointer;transition:.16s}
.fchip:hover{border-color:var(--text-soft)}
.fchip.on{background:var(--accent-btn);border-color:var(--accent-btn);color:#fff;box-shadow:0 4px 10px -4px var(--accent-soft)}
.fchip .cnt{margin-left:5px;opacity:.75}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;white-space:nowrap;background:color-mix(in srgb, var(--pc) 15%, transparent);border:1px solid color-mix(in srgb, var(--pc) 45%, transparent);color:color-mix(in srgb, var(--pc) 60%, var(--text))}
.badge{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:99px;border:1px solid}
.badge i{width:7px;height:7px;border-radius:50%;background:currentColor}
.badge.pending{background:var(--pend-bg);border-color:var(--pend-bd);color:var(--pend-tx)}
.badge.pending i{animation:pulse 2s infinite}
.badge.approved{background:var(--ok-bg);border-color:var(--ok-bd);color:var(--ok-tx)}
.badge.rejected{background:var(--danger-bg);border-color:var(--danger-bd);color:var(--danger-tx)}
.bar{height:8px;background:var(--track);border-radius:99px;overflow:hidden;flex:1}
.bar i{display:block;height:100%;width:0;border-radius:99px;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.brow{display:flex;align-items:center;gap:14px;padding:9px 0;border-bottom:1px dashed var(--line)}
.brow:last-child{border-bottom:none}
.bname{font-weight:600;font-size:13.5px;width:150px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bbars{display:flex;gap:10px;flex-wrap:wrap;flex:1}
.bseg{display:flex;align-items:center;gap:6px;width:118px}
.bseg .bar{width:72px;flex:none}
.bseg small{font-family:var(--mono);font-size:10.5px;color:var(--text-soft)}
.bseg small.neg{color:var(--danger-tx);font-weight:600}
.tscroll{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;min-width:760px}
.tbl th{font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--text-soft);text-align:left;padding:10px;border-bottom:1.5px solid var(--line)}
.tbl td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:13.5px}
.tbl tbody tr{transition:background .15s}
.tbl tbody tr:hover{background:var(--surface-2)}
.tbl tr.dim{opacity:.5}
.emp-cell{display:flex;align-items:center;gap:11px}
.emp-cell .nm{font-weight:600;transition:color .15s}
.emp-cell .em{font-size:11.5px;color:var(--text-soft);font-family:var(--mono)}
.rrow td:first-child{border-left:4px solid transparent}
.reason{font-size:11.5px;color:var(--text-soft);font-style:italic;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.warnflag{font-family:var(--mono);font-size:10px;color:var(--danger-tx);border:1px solid var(--danger-bd);background:var(--danger-bg);border-radius:6px;padding:2px 6px;margin-left:6px}
.attflag{font-family:var(--mono);font-size:10px;color:var(--accent-text);border:1px solid var(--accent-soft);background:color-mix(in srgb, var(--accent-btn) 8%, transparent);border-radius:6px;padding:2px 6px;margin-left:6px;cursor:pointer;text-decoration:none;display:inline-block}
.attflag:hover{text-decoration:underline}
.hide{display:none!important}
[data-profile]{cursor:pointer}
tr[data-profile]:hover .nm{color:var(--accent-text)}
.brow[data-profile]:hover .bname{color:var(--accent-text)}
.qrow{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px dashed var(--line)}
.qrow:last-child{border-bottom:none}
.qrow .qinfo{flex:1;min-width:0}
.qrow .qn{font-weight:600;font-size:13.5px}
.qrow .qd{font-family:var(--mono);font-size:11.5px;color:var(--text-soft);margin-top:2px}
.qacts{display:flex;gap:7px}
.urow{display:flex;align-items:center;gap:13px;padding:10px 0;border-bottom:1px dashed var(--line)}
.urow:last-child{border-bottom:none}

function fmtNum(n){ n=Math.round(n*10)/10; return Number.isInteger(n)?String(n):n.toFixed(1); }
function fmtDays(n){ return fmtNum(n)+'d'; }
function fmtDateTime(iso){ const d=new Date(iso); return d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'2-digit'})+' · '+d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}); }
function fmtDateFull(iso){ return fmt(iso,{year:'2-digit',month:'short',day:'numeric'}); }

function isHoliday(iso){ return (state.settings.holidays||[]).some(h=>h.date===iso); }
function holidayName(iso){ const h=(state.settings.holidays||[]).find(x=>x.date===iso); return h?h.name:''; }
function workingDays(from,to,countsWeekends){
  if(!from||!to||to<from) return 0;
  let n=0,d=fromISO(from),end=fromISO(to);
  while(d<=end && n<400){
    const iso=toISO(d), g=d.getDay(), wknd=(g===0||g===6);
    if(countsWeekends) n++;
    else if(!wknd && !isHoliday(iso)) n++;
    d.setDate(d.getDate()+1);
  }
  return n;
}
function computeDays(from,to,tp,durationType='full',hoursPerDay=8){
  const count=workingDays(from,to,tp.countsWeekends);
  if(durationType==='half') return count*0.5;
  if(durationType==='hours') return count*(Math.min(8,Math.max(0.5,hoursPerDay||8))/8);
  return count;
}
function monthsElapsedInFY(year,ref){
  const now=ref||new Date();
  if(now.getFullYear()>year) return 12;
  if(now.getFullYear()<year) return 0;
  return now.getMonth()+1;
}
function usedDaysInYear(empId,typeId,year){
  return state.requests.filter(r=>r.employeeId===empId&&r.typeId===typeId&&r.status==='approved'&&r.from.slice(0,4)===String(year)).reduce((s,r)=>s+r.days,0);
}
function usedDays(empId,typeId){ return usedDaysInYear(empId,typeId,state.settings.year); }
function effectiveAllowance(emp,tp,year){
  year=year||state.settings.year;
  let base=allowanceFor(emp,tp.id);
  if(!base) return 0;
  if(tp.accrualRate==='monthly'){ base=base*(monthsElapsedInFY(year)/12); }
  if(tp.proRateFromJoinDate&&emp.joined){
    const j=fromISO(emp.joined);
    if(j.getFullYear()===year){ base=base*((12-j.getMonth())/12); }
    else if(j.getFullYear()>year){ return 0; }
  }
  if(tp.carryoverCap>0){
    const prev=year-1;
    const prevAllow=allowanceFor(emp,tp.id);
    const prevUsed=usedDaysInYear(emp.id,tp.id,prev);
    const unused=prevAllow-prevUsed;
    base+=Math.max(0,Math.min(unused,tp.carryoverCap));
  }
  return Math.round(base*10)/10;
}

function hashPw(pw,salt){
  const s=(salt||'')+'|'+pw;
  let h1=0xdeadbeef,h2=0x41c6ce57;
  for(let i=0;i<s.length;i++){const ch=s.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677);}
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return (h2>>>0).toString(16).padStart(8,'0')+(h1>>>0).toString(16).padStart(8,'0');
}

  settings.holidays=Array.isArray(settings.holidays)?settings.holidays.map(h=>({id:h.id||uid(),date:h.date,name:h.name||'Holiday'})):[];
  settings.year=Number(settings.year)||new Date().getFullYear();

function revealActive(){
  $$('.view.on .reveal').forEach((el,i)=>setTimeout(()=>el.classList.add('in'),Math.min(i*80,420)));
  requestAnimationFrame(()=>$$('.view.on .bar>i, .view.on .chart-bar i').forEach(i=>i.style.width=(i.dataset.w||0)+'%'));
  $$('.view.on [data-count]').forEach(countUp);
}
function countUp(el){
  const target=+el.dataset.count,dur=750,st=performance.now();
  (function f(now){const p=Math.min(1,(now-st)/dur),e=1-Math.pow(1-p,3);
    el.textContent=Math.round(target*e).toLocaleString(); if(p<1)requestAnimationFrame(f)})(st);
}

function balanceCardsHTML(e){
  const y=state.settings.year;
  const cards=state.settings.leaveTypes
    .filter(tp=>isEligible(e,tp)&&(allowanceFor(e,tp.id)>0||usedDays(e.id,tp.id)>0))
    .map(tp=>{
      const allow=effectiveAllowance(e,tp,y),used=usedDays(e.id,tp.id),left=allow-used;
      const pct=allow>0?Math.min(100,used/allow*100):100;
      return `<div class="pcard" style="--pc:${tp.color}">
        <div class="pc-top"><span class="pill" style="--pc:${tp.color}">${esc(tp.name)}</span>
          <b class="${left<0?'neg':''}">${left<0?'−'+fmtNum(Math.abs(left)):fmtNum(left)}d left</b></div>
        <div class="bar"><i data-w="${pct}" style="background:${left<0?'var(--danger)':tp.color}"></i></div>
        <div class="pc-meta">${fmtNum(used)} of ${fmtNum(allow)} used · FY ${y}${tp.accrualRate==='monthly'?' · accrues monthly':''}</div></div>`;
    }).join('');
  return cards||'<div class="pnone">No tracked leave types for this person.</div>';
}
function reqRowHTML(r,cancelable){

function historySectionsHTML(e,opts={}){
  const t=today();
  const reqs=state.requests.filter(r=>r.employeeId===e.id);
  const current=reqs.filter(r=>r.status!=='rejected'&&r.from<=t&&r.to>=t);
  const upcoming=reqs.filter(r=>r.from>t&&r.status!=='rejected').sort((a,b)=>a.from.localeCompare(b.from));
  const past=reqs.filter(r=>r.to<t).sort((a,b)=>b.from.localeCompare(a.from));
  const section=(label,arr)=>{
    const sum=arr.reduce((s,r)=>s+r.days,0);
    return `<span class="klabel psec">${label} <span style="opacity:.7">(${arr.length}${arr.length?` · ${fmtDays(sum)}`:''})</span></span>`
      +(arr.length?arr.map(r=>reqRowHTML(r,opts.cancel)).join(''):'<div class="pnone">Nothing here.</div>');
  };
  return section('Currently on leave',current)+section('Upcoming',upcoming)+section('Past',past);
}

function openDaysBookedModal(){
  const y=state.settings.year;

  const total=approved.reduce((s,r)=>s+r.days,0);
  const byType={},byEmp={};
  approved.forEach(r=>{
    byType[r.typeId]=byType[r.typeId]||{days:0,count:0,emps:new Set()};
    byType[r.typeId].days+=r.days; byType[r.typeId].count++; byType[r.typeId].emps.add(r.employeeId);
    byEmp[r.employeeId]=(byEmp[r.employeeId]||0)+r.days;

  const typeRows=Object.entries(byType).sort((a,b)=>b[1].days-a[1].days).map(([tid,v])=>{

function renderDashboard(){
  const t=today(),y=state.settings.year;
  const active=state.employees.filter(e=>e.status!=='left');
  const pending=state.requests.filter(r=>r.status==='pending').sort((a,b)=>a.createdAt.localeCompare(b.createdAt));
  const approved=state.requests.filter(r=>r.status==='approved');
  const daysBooked=approved.filter(inYear).reduce((s,r)=>s+r.days,0);
  const onToday=[...new Set(approved.filter(r=>r.from<=t&&r.to>=t).map(r=>r.employeeId))].map(empById).filter(Boolean);
  const upcoming=approved.filter(r=>r.from>t).sort((a,b)=>a.from.localeCompare(b.from)).slice(0,6);
  const hour=new Date().getHours();
  const greet=hour<12?'Good morning':hour<18?'Good afternoon':'Good evening';
  let heroSub;
  if(onToday.length===0&&pending.length===0) heroSub='Nobody is out today and the approval queue is clear. A quiet ledger.';
  else heroSub=[onToday.length?`${onToday.length} ${onToday.length===1?'person is':'people are'} on leave today`:null,
    pending.length?`${pending.length} request${pending.length===1?'':'s'} awaiting a decision`:null].filter(Boolean).join(' · ')+'. ';
  const avs=onToday.slice(0,6).map(e=>`<span class="av" data-profile="${e.id}" style="background:${hashColor(e.name)}" title="${esc(e.name)} — view profile">${esc(initials(e.name))}</span>`).join('')
    +(upcoming.length?`<span class="h-chip">+ ${upcoming.length} upcoming</span>`:'');
  const tiles=[
    {k:'pending',l:'Pending approvals',v:pending.length,c:'#d9930d',h:pending.length?'waiting in the queue':'inbox zero',go:'open queue →'},
    {k:'ontoday',l:'On leave today',v:onToday.length,c:'#0f8a8a',h:fmt(t,{weekday:'long',month:'long',day:'numeric'}),go:'who\u2019s out →'},
    {k:'booked',l:'Days booked · '+y,v:Math.round(daysBooked*10)/10,c:'#3e63c4',h:'across approved requests',go:'breakdown →'},
    {k:'team',l:'Active team',v:active.length,c:'#64748b',h:state.settings.companyName,go:'view team →'},
  ].map(x=>`<div class="tile reveal" data-tile="${x.k}" role="button" tabindex="0" title="Click to expand" style="--ac:${x.c}">
      <span class="klabel">${x.l}</span><b data-count="${x.v}">0</b><div class="hint">${esc(x.h)}</div><span class="tile-hintgo">${x.go}</span></div>`).join('');
  const queue=pending.length?pending.map(r=>{
    const e=empById(r.employeeId); if(!e)return''; const tp=typeById(r.typeId);
    return `<div class="qrow" data-profile="${e.id}">${avatarHTML(e.name,1)}
      <div class="qinfo"><div class="qn">${esc(e.name)} ${typePill(tp)}${mismatch(e,tp)?'<span class="warnflag">eligibility</span>':''}${attChip(r)}</div>
      <div class="qd">${esc(e.department||'')} · ${rangeLabel(r.from,r.to)} · ${fmtDays(r.days)}${overlapsOf(r).length?' <span class="warnflag">overlap</span>':''}</div></div>
      <div class="qacts"><button class="icon-btn ok" data-approve="${r.id}" title="Approve"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M4 12l5 5L20 7"/></svg></button>
      <button class="icon-btn no" data-reject="${r.id}" title="Reject"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div></div>`;
  }).join(''):`<div class="empty"><span class="glyph">✷</span><p>Inbox zero — no leave requests waiting for approval.</p></div>`;
  const up=upcoming.length?upcoming.map(r=>{
    const e=empById(r.employeeId); if(!e)return''; const tp=typeById(r.typeId),d=fromISO(r.from);
    return `<div class="urow" data-profile="${e.id}"><div class="db"><b>${d.getDate()}</b><span>${d.toLocaleDateString(undefined,{month:'short'})}</span></div>
      <div class="uinfo"><div class="un">${esc(e.name)}</div><div class="ud">${rangeLabel(r.from,r.to)} · ${fmtDays(r.days)}</div></div>${typePill(tp)}</div>`;
  }).join(''):`<div class="empty"><span class="glyph">☀</span><p>No approved time off coming up.</p></div>`;
  const bars=active.map(e=>{
    const segs=state.settings.leaveTypes.filter(tp=>allowanceFor(e,tp.id)>0||usedDays(e.id,tp.id)>0).map(tp=>{
      const allow=effectiveAllowance(e,tp,y),used=usedDays(e.id,tp.id),left=allow-used;
      const pct=allow>0?Math.min(100,used/allow*100):100;
      return `<div class="bseg" title="${esc(tp.name)} — ${fmtNum(used)} of ${fmtNum(allow)} used"><div class="bar"><i data-w="${pct}" style="background:${left<0?'var(--danger)':tp.color}"></i></div>
        <small class="${left<0?'neg':''}">${left<0?'−'+fmtNum(Math.abs(left)):fmtNum(left)}d</small></div>`;
    }).join('');
    return `<div class="brow" data-profile="${e.id}" title="View ${esc(e.name)}\u2019s profile"><span class="bname">${esc(e.name)}</span><div class="bbars">${segs||'<small class="mono" style="color:var(--text-soft)">no tracked types</small>'}</div></div>`;
  }).join('');
  $('#view-dashboard').innerHTML=`
    <section class="hero reveal">
      <div><div class="kicker">${esc(state.settings.companyName)} · Fiscal year ${y}</div>
        <h1>${greet}.</h1><p class="sub">${esc(heroSub)}</p></div>
      <div class="h-avs">${avs||'<span class="h-chip">everyone\u2019s at their desk</span>'}</div>

    <div class="tiles">${tiles}</div>
    <div class="grid-2">
      <div class="panel reveal"><div class="panel-head"><h2>Approval queue</h2><span class="chip">${pending.length} open</span></div>
        <div class="panel-body">${queue}</div></div>
      <div class="stack">
        <div class="panel reveal"><div class="panel-head"><h2>Coming up</h2></div><div class="panel-body">${up}</div></div>
        <div class="panel reveal"><div class="panel-head"><h2>Remaining balances</h2><span class="chip">${y}</span></div>
          <div class="panel-body">${bars||'<div class="empty"><p>Add people in the Team tab to start tracking balances.</p></div>'}</div></div>
      </div>
    </div>`;
}

function renderCalendar(){
  const m=ui.month,y=m.getFullYear(),mo=m.getMonth(),t=today();
  const ws=state.settings.weekStartsMonday;
  const wdLabels=ws?['Mon','Tue','Wed','Thu','Fri','Sat','Sun']:['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const firstIdx=ws?(new Date(y,mo,1).getDay()+6)%7:new Date(y,mo,1).getDay();
  const dim=new Date(y,mo+1,0).getDate();
  const active=state.requests.filter(r=>r.status==='approved'||r.status==='pending');
  const totals={};
  let cells='';
  for(let i=0;i<firstIdx;i++) cells+='<div class="cell blank"></div>';
  for(let d=1;d<=dim;d++){
    const iso=`${y}-${pad(mo+1)}-${pad(d)}`,g=fromISO(iso).getDay(),wk=g===0||g===6;
    const hol=isHoliday(iso), holName=holidayName(iso);
    const hits=active.filter(r=>r.from<=iso&&r.to>=iso).sort((a,b)=>(a.status===b.status?0:a.status==='approved'?-1:1));
    hits.filter(r=>r.status==='approved').forEach(r=>{totals[r.typeId]=(totals[r.typeId]||0)+(typeById(r.typeId).countsWeekends||(!wk&&!hol)?1:0)});
    const holPill=hol?`<span class="cpill" style="--pc:var(--hol)" title="Public holiday">${esc(holName)}</span>`:'';
    const pills=hits.slice(0,3).map(r=>{
      const e=empById(r.employeeId),tp=typeById(r.typeId); if(!e)return'';
      return `<span class="cpill ${r.status==='pending'?'pend':''}" title="${esc(e.name)} · ${esc(tp.name)} (${r.status})" style="--pc:${tp.color}">${esc(e.name.split(' ')[0])}</span>`;
    }).join('');
    const more=hits.length>3?`<span class="cmore">+${hits.length-3} more</span>`:'';
    cells+=`<div class="cell ${wk?'weekend':''} ${hol?'holiday':''} ${iso===t?'today':''}"><span class="dnum">${d}</span>${holPill}${pills}${more}</div>`;
  }
  const legend=state.settings.leaveTypes.map(tp=>
    `<span class="li"><i style="background:${tp.color}"></i>${esc(tp.name)} <b>${fmtNum(totals[tp.id]||0)}d</b></span>`).join('');
  $('#view-calendar').innerHTML=`
    <div class="panel reveal"><div class="panel-head cal-head">
      <div class="cal-title">${m.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</div>
      <div class="cal-nav">
        <button class="icon-btn" data-cal="-1" title="Previous month"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M14 5l-7 7 7 7"/></svg></button>
        <button class="btn btn-sm" data-cal="0">Today</button>
        <button class="icon-btn" data-cal="1" title="Next month"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M10 5l7 7-7 7"/></svg></button>
      </div></div>
      <div class="panel-body"><div class="wdrow">${wdLabels.map(w=>`<span>${w}</span>`).join('')}</div>
      <div class="cal">${cells}</div>
      <div class="legend" style="margin-top:16px">${legend}<span class="li"><i style="background:var(--hol)"></i>Public holiday</span>
      <span class="li" style="margin-left:auto"><span class="chip">solid = approved · dashed = pending</span></span></div></div></div>`;
}

function scopeEmployees(me){
  const active=state.employees.filter(e=>e.status!=='left');
  if(me.role==='hr') return active;
  if(me.role==='manager') return active.filter(e=>e.managerId===me.id);
  return [];
}
function requestsForScope(me){
  const empIds=new Set(scopeEmployees(me).map(e=>e.id));
  return state.requests.filter(r=>empIds.has(r.employeeId));
}
function inScopePeriod(r){
  if(ui.reportScope==='fy') return r.from.slice(0,4)===String(state.settings.year);
  return true;
}
function reportOverviewData(me){
  const emps=scopeEmployees(me);
  const reqs=requestsForScope(me).filter(r=>r.status==='approved'&&inScopePeriod(r));
  const total=reqs.reduce((s,r)=>s+r.days,0);
  const byType={};
  reqs.forEach(r=>{ byType[r.typeId]=byType[r.typeId]||{days:0,count:0,emps:new Set()}; byType[r.typeId].days+=r.days; byType[r.typeId].count++; byType[r.typeId].emps.add(r.employeeId); });
  const byEmp={};
  reqs.forEach(r=>{byEmp[r.employeeId]=(byEmp[r.employeeId]||0)+r.days});
  const empIdsWithLeave=new Set(Object.keys(byEmp));
  const neverTook=emps.filter(e=>!empIdsWithLeave.has(e.id));
  let totalAllow=0,totalUsed=0;
  emps.forEach(e=>{ state.settings.leaveTypes.forEach(tp=>{ if(isEligible(e,tp)&&tp.allowance>0){ totalAllow+=effectiveAllowance(e,tp,state.settings.year); totalUsed+=usedDays(e.id,tp.id); } }); });
  const utilization=totalAllow?Math.round(totalUsed/totalAllow*100):0;
  const topUsers=Object.entries(byEmp).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([eid,d])=>{const e=empById(eid);return e?{name:e.name,dept:e.department||'—',days:d}:null}).filter(Boolean);
  const typeBreakdown=Object.entries(byType).sort((a,b)=>b[1].days-a[1].days).map(([tid,v])=>{const tp=typeById(tid);return {id:tid,name:tp.name,color:tp.color,days:v.days,count:v.count,people:v.emps.size,pct:total?(v.days/total*100):0}});
  return {emps,reqs,total,byType,typeBreakdown,neverTook,utilization,topUsers,totalAllow,totalUsed};
}

function renderBalancesReport(me){
  const emps=scopeEmployees(me);

      const cls=left<0?'neg':'';
      return `<td class="mono" style="font-size:11.5px"><span class="${cls}">${fmtNum(used)}/${fmtNum(allow)}</span><br><span class="${cls}" style="color:var(--text-soft)">${left<0?'−'+fmtNum(Math.abs(left)):fmtNum(left)}d left</span></td>`;

      </tr></thead>

function renderTrendsReport(me){

  approved.forEach(r=>{ const d=fromISO(r.from); if(d.getFullYear()===y) months[d.getMonth()].fy+=r.days; months[d.getMonth()].allTime+=r.days; months[d.getMonth()].byType[r.typeId]=(months[d.getMonth()].byType[r.typeId]||0)+r.days; });
  const maxDays=Math.max(...months.map(m=>m.fy),1);
  const types=state.settings.leaveTypes;
  const bars=months.map(m=>{
    const total=m.fy; const height=total/maxDays*180;
    const segs=types.map(tp=>{ const v=m.byType[tp.id]||0; const segH=total?(v/total*height):0; return v?`<div class="vbar-seg" style="background:${tp.color};height:0" data-h="${segH}px" title="${esc(tp.name)}: ${fmtNum(v)}d"></div>`:''; }).join('');

        <div class="legend" style="margin-top:14px">${types.map(tp=>`<span class="li"><i style="background:${tp.color}"></i>${esc(tp.name)}</span>`).join('')}</div></div>

function printBalances(me){
  const emps=scopeEmployees(me);
  const types=state.settings.leaveTypes;
  const y=state.settings.year;
  const rows=emps.map(e=>{
    const totalAllow=types.filter(tp=>isEligible(e,tp)&&tp.allowance>0).reduce((s,tp)=>s+effectiveAllowance(e,tp,y),0);
    const totalUsed=types.filter(tp=>isEligible(e,tp)).reduce((s,tp)=>s+usedDays(e.id,tp.id),0);
    const totalLeft=totalAllow-totalUsed;
    const util=totalAllow?Math.round(totalUsed/totalAllow*100):0;
    const flag=totalLeft<0?'neg':(util===0&&totalAllow>0?'zero':(util>=90?'warn':'ok'));
    const flagLabel=totalLeft<0?'Overdrawn':(util===0&&totalAllow>0?'Unused':(util>=90?'Near limit':'OK'));
    return {e,totalAllow,totalUsed,totalLeft,util,flag,flagLabel};
  });
  return `<h2>Balance summary</h2>
  <table><thead><tr><th>Employee</th><th>Department</th><th class="num">Allowance</th><th class="num">Used</th><th class="num">Remaining</th><th class="num">Utilization</th><th>Status</th></tr></thead>
  <tbody>${rows.map(r=>`<tr>
    <td>${esc(r.e.name)}</td><td>${esc(r.e.department||'—')}</td>
    <td class="num">${fmtNum(r.totalAllow)}</td><td class="num">${fmtNum(r.totalUsed)}</td>
    <td class="num ${r.totalLeft<0?'neg':''}">${fmtNum(r.totalLeft)}</td>
    <td class="num">${r.util}%</td>
    <td><span class="flag ${r.flag}">${r.flagLabel}</span></td></tr>`).join('')||'<tr><td colspan="7">No people in scope.</td></tr>'}</tbody></table>
  <div class="page-break"></div>
  <h2>Remaining days by leave type</h2>
  <table><thead><tr><th>Employee</th>${types.map(tp=>`<th class="num">${esc(tp.name.length>14?tp.name.slice(0,14)+'…':tp.name)}</th>`).join('')}</tr></thead>
  <tbody>${rows.map(r=>`<tr><td>${esc(r.e.name)}</td>${types.map(tp=>{
    if(!isEligible(r.e,tp)) return `<td class="num">—</td>`;
    const allow=effectiveAllowance(r.e,tp,y),used=usedDays(r.e.id,tp.id),left=allow-used;
    return `<td class="num ${left<0?'neg':''}">${fmtNum(left)}</td>`;
  }).join('')}</tr>`).join('')}</tbody></table>
  <p class="note">Allowances reflect accrual, join-date pro-ration and carryover for ${ui.reportScope==='fy'?'FY '+y:'the selected period'}. Negative values indicate overdrawn balances.</p>`;
}
function printTrends(me){

function printDepartments(me){
  const emps=scopeEmployees(me);
  const deptMap={};
  emps.forEach(e=>{const k=e.department||'No department'; deptMap[k]=deptMap[k]||{headcount:0,totalAllow:0,totalUsed:0}; deptMap[k].headcount++;
    state.settings.leaveTypes.forEach(tp=>{ if(isEligible(e,tp)&&tp.allowance>0) deptMap[k].totalAllow+=effectiveAllowance(e,tp,state.settings.year); if(isEligible(e,tp)) deptMap[k].totalUsed+=usedDays(e.id,tp.id); });});
  const entries=Object.entries(deptMap).sort((a,b)=>{const ua=a[1].totalAllow?(a[1].totalUsed/a[1].totalAllow):0;const ub=b[1].totalAllow?(b[1].totalUsed/b[1].totalAllow):0;return ub-ua;});
  return `<h2>Department summary</h2>
  <table><thead><tr><th>Department</th><th class="num">Headcount</th><th class="num">Total allowance</th><th class="num">Used</th><th class="num">Utilization</th><th class="num">Avg / person</th></tr></thead>
  <tbody>${entries.map(([name,v])=>{const util=v.totalAllow?Math.round(v.totalUsed/v.totalAllow*100):0;const avg=v.headcount?Math.round(v.totalUsed/v.headcount*10)/10:0;
    return `<tr><td>${esc(name)}</td><td class="num">${v.headcount}</td><td class="num">${fmtNum(v.totalAllow)}</td><td class="num">${fmtNum(v.totalUsed)}</td><td class="num ${util>=90?'neg':''}">${util}%</td><td class="num">${avg}</td></tr>`;}).join('')||'<tr><td colspan="6">No departments with data.</td></tr>'}</tbody></table>`;
}

function exportPDF(){
  const me=currentUser(); if(!me)return;
  const doc=buildPrintDocument(me);
  let iframe=document.getElementById('printFrame');
  if(iframe) iframe.remove();
  iframe=document.createElement('iframe');
  iframe.id='printFrame';
  document.body.appendChild(iframe);
  iframe.onload=()=>{
    const win=iframe.contentWindow;
    setTimeout(()=>{
      win.focus();
      win.onafterprint=()=>iframe.remove();
      win.print();
      setTimeout(()=>{ if(document.getElementById('printFrame')) iframe.remove(); },60000);
    },300);
  };
  iframe.srcdoc=doc;
  toast('Opening print dialog — choose \u201cSave as PDF\u201d to export.','ok');
}

function exportReportCSV(kind,me){
  const y=state.settings.year;
  const co=state.settings.companyName.replace(/[^a-z0-9]+/gi,'-');
  const csv=(rows)=>{ const esc_cell=v=>{const s=String(v??'');return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}; return rows.map(r=>r.map(esc_cell).join(',')).join('\n'); };
  const download=(name,rows)=>{ const blob=new Blob([csv(rows)],{type:'text/csv;charset=utf-8'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click(); URL.revokeObjectURL(a.href); toast('Exported '+name,'ok'); };
  if(kind==='overview'){
    const d=reportOverviewData(me);
    const rows=[['Metric','Value'],['Scope',me.role==='manager'?'My team':'All employees'],['Period',ui.reportScope==='fy'?'FY '+y:'All time'],['People in scope',d.emps.length],['Total approved days',d.total],['Approved requests',d.reqs.length],['Utilization %',d.utilization],['Total allowance-days',d.totalAllow],['Total used-days',d.totalUsed],['People with zero usage',d.neverTook.length],[],['Leave type','Days','Requests','People'],...d.typeBreakdown.map(t=>[t.name,t.days,t.count,t.people])];
    download(`${co}-overview-${y}.csv`,rows);
  } else if(kind==='balances'){
    const emps=scopeEmployees(me); const types=state.settings.leaveTypes;
    const header=['Person','Department','Role','Total allowance','Total used','Total remaining','Utilization %',...types.map(t=>t.name+' used'),...types.map(t=>t.name+' remaining')];
    const rows=[header,...emps.map(e=>{
      const usedByType=types.map(t=>isEligible(e,t)?usedDays(e.id,t.id):'');
      const leftByType=types.map(t=>isEligible(e,t)?(effectiveAllowance(e,t,state.settings.year)-usedDays(e.id,t.id)):'');
      const totalAllow=types.filter(t=>isEligible(e,t)&&t.allowance>0).reduce((s,t)=>s+effectiveAllowance(e,t,state.settings.year),0);
      const totalUsed=types.filter(t=>isEligible(e,t)).reduce((s,t)=>s+usedDays(e.id,t.id),0);
      const util=totalAllow?Math.round(totalUsed/totalAllow*100):0;
      return [e.name,e.department||'',e.roleTitle||'',totalAllow,totalUsed,totalAllow-totalUsed,util,...usedByType,...leftByType]; })];
    download(`${co}-balances-${y}.csv`,rows);
  } else if(kind==='trends'){
    const reqs=requestsForScope(me).filter(r=>r.status==='approved');
    const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const fy=Array(12).fill(0),all=Array(12).fill(0);
    reqs.forEach(r=>{ const d=fromISO(r.from); if(d.getFullYear()===y) fy[d.getMonth()]+=r.days; all[d.getMonth()]+=r.days; });
    download(`${co}-trends-${y}.csv`,[['Month',`FY ${y}`,'All time'],...months.map((m,i)=>[m,fy[i],all[i]])]);
  } else if(kind==='departments'){
    const emps=scopeEmployees(me); const deptMap={};
    emps.forEach(e=>{ const k=e.department||'No department'; deptMap[k]=deptMap[k]||{headcount:0,totalAllow:0,totalUsed:0}; deptMap[k].headcount++;
      state.settings.leaveTypes.forEach(tp=>{ if(isEligible(e,tp)&&tp.allowance>0) deptMap[k].totalAllow+=effectiveAllowance(e,tp,state.settings.year); if(isEligible(e,tp)) deptMap[k].totalUsed+=usedDays(e.id,tp.id); }); });
    const rows=[['Department','Headcount','Total allowance','Total used','Utilization %','Avg days per person'],
      ...Object.entries(deptMap).map(([name,v])=>{ const util=v.totalAllow?Math.round(v.totalUsed/v.totalAllow*100):0; const avg=v.headcount?Math.round(v.totalUsed/v.headcount*10)/10:0; return [name,v.headcount,v.totalAllow,v.totalUsed,util,avg]; })];
    download(`${co}-departments-${y}.csv`,rows);
  } else if(kind==='absences'){
    const reqs=requestsForScope(me).filter(r=>inScopePeriod(r)&&(r.status==='approved'||r.status==='pending')).sort((a,b)=>b.from.localeCompare(a.from));
    const rows=[['Person','Department','Leave type','From','To','Days','Duration','Status','Reason'],
      ...reqs.map(r=>{ const e=empById(r.employeeId); const tp=typeById(r.typeId);
        return [e?e.name:'',e?e.department||'':'',tp.name,r.from,r.to,r.days,r.durationType==='half'?'half-days':(r.durationType==='hours'?r.hoursPerDay+'h/day':'full'),r.status,r.reason||'']; })];
    download(`${co}-absences-${y}.csv`,rows);
  }
}

  const reqs=state.requests.filter(r=>r.employeeId===e.id);
  const daysUsed=reqs.filter(r=>r.status==='approved'&&inYear(r)).reduce((s,r)=>s+r.days,0);
  const daysPending=reqs.filter(r=>r.status==='pending'&&inYear(r)).reduce((s,r)=>s+r.days,0);
  const upcoming=reqs.filter(r=>r.from>t&&r.status!=='rejected').sort((a,b)=>a.from.localeCompare(b.from));
  const next=upcoming.find(r=>r.status==='approved')||upcoming[0];
  const delegActive=mgr&&deleg&&isOnLeaveToday(mgr.id);
  openModal(`
    <div class="phead">
      <span class="av av-lg" style="background:${hashColor(e.name)}">${esc(initials(e.name))}</span>
      <div style="flex:1;min-width:0">
        <h3 style="margin-bottom:0">${esc(e.name)}</h3>
        <div class="psub">${esc(e.roleTitle||'—')} · ${esc(e.department||'No department')}</div>
        ${(e.username||e.email)?`<div class="pmail">${e.username?'@'+esc(e.username)+' · ':''}${esc(e.email||'no email')}</div>`:''}
        <div class="chiprow">
          ${rolePill(e.role)}
          <span class="chip" title="Sex">${sexLabel(e.sex)}</span>
          <span class="chip">Joined ${e.joined?fmt(e.joined,{year:'numeric',month:'short',day:'numeric'}):'—'}</span>
          ${mgr?`<span class="chip">Reports to ${esc(mgr.name)}</span>`:''}
          ${deleg?`<span class="chip ${delegActive?'deleg':''}">Delegate: ${esc(deleg.name)}${delegActive?' (active)':''}</span>`:''}
          ${e.status==='left'?'<span class="chip">Left company</span>':''}
        </div>
      </div>
      ${onNow?'<span class="badge approved"><i></i>On leave now</span>':''}
    </div>
    <div class="pstats">
      <div><span class="klabel">Approved · FY ${state.settings.year}</span><b>${fmtNum(daysUsed)}d</b></div>
      <div><span class="klabel">Pending</span><b>${fmtNum(daysPending)}d</b></div>
      <div><span class="klabel">Next leave</span><b>${next?fmt(next.from):'—'}</b></div>
    </div>
    <span class="klabel">Balances · FY ${state.settings.year}</span>
    <div class="pcards" style="margin-top:8px">${balanceCardsHTML(e)}</div>
    ${historySectionsHTML(e)}
    <div class="mactions" style="justify-content:space-between">
      <div style="display:flex;gap:10px">
        ${canReqFor?`<button class="btn btn-primary btn-sm" id="pf-newreq">+ New request</button>`:''}
        ${isHR?`<button class="btn btn-sm" id="pf-edit">Edit profile</button>`:''}
      </div>
      <button class="btn btn-sm" id="pf-close">Close</button>
    </div>`,true,()=>openProfileModal(id));
  animateModalBars();
  $('#pf-close').onclick=closeModal;
  if(isHR)$('#pf-edit').onclick=()=>openEmpModal(e.id);
  if(canReqFor)$('#pf-newreq').onclick=()=>openRequestModal({empId:e.id});
}

function openRequestModal(opts={}){
  const me=currentUser();
  if(!state.employees.length){toast('Add a person in the Team tab first.','err');return}
  let pool;
  if(me.role==='hr')pool=state.employees.filter(e=>e.status!=='left');
  else if(me.role==='manager')pool=[me,...state.employees.filter(e=>e.managerId===me.id&&e.status!=='left')];
  else pool=[me];
  const lock=!!opts.lock||pool.length<2;
  const empOpts=pool.map(e=>`<option value="${e.id}">${esc(e.name)} — ${esc(e.department||'')}</option>`).join('');
  openModal(`<h3>New leave request</h3><p class="msub">Days skip weekends and public holidays. Sex-restricted types are only offered to eligible employees. You can attach supporting documents (≤2 MB).</p>
    <form id="rqForm">
      <div class="field"><label>Employee</label><select id="rq-emp" ${lock?'disabled':''}>${empOpts}</select>
        ${lock?'<div class="field-note">Locked to your own requests'+(me.role==='manager'?' — log requests for your reports from their profile.':'')+'</div>':''}</div>
      <div class="field"><label>Leave type</label><select id="rq-type"></select><div class="field-note" id="type-note"></div></div>
      <div class="mrow">
        <div class="field"><label>First day</label><input type="date" id="rq-from" value="${today()}" required></div>
        <div class="field"><label>Last day</label><input type="date" id="rq-to" value="${today()}" required></div>
      </div>
      <div class="mrow">
        <div class="field"><label>Duration</label>
          <select id="rq-dur">
            <option value="full" selected>Full days</option>
            <option value="half">Half days (0.5 each)</option>
            <option value="hours">Custom hours per day</option>
          </select></div>
        <div class="field" id="rq-hours-wrap" style="display:none"><label>Hours / day</label>
          <input type="number" id="rq-hours" min="0.5" max="8" step="0.5" value="4"></div>
      </div>
      <div class="field"><label>Reason <span style="text-transform:none;letter-spacing:0">(optional)</span></label><input id="rq-reason" maxlength="140" placeholder="Holiday, appointment, recovery…"></div>
      <div class="field"><label>Attachment <span style="text-transform:none;letter-spacing:0">(optional, ≤2 MB — e.g. doctor\u2019s note)</span></label><input type="file" id="rq-file"></div>
      <div class="prev-box"><div class="prev-grid">
        <div><span class="klabel">Working time</span><b id="pv-days">—</b></div>
        <div><span class="klabel">Balance after approval</span><b id="pv-bal">—</b></div></div>
        <div id="pv-warn"></div></div>
      <div class="mactions"><button type="button" class="btn" id="rq-cancel">Cancel</button>
        <button type="submit" class="btn btn-primary" id="rq-submit">Submit request</button></div>
    </form>`,false,()=>openRequestModal(opts));
  $('#rq-cancel').onclick=closeModal;
  if(opts.empId&&pool.some(e=>e.id===opts.empId))$('#rq-emp').value=opts.empId;

  function refreshTypeOptions(){
    const emp=empById($('#rq-emp').value); if(!emp)return;
    const sel=$('#rq-type'), prev=sel.value;
    sel.innerHTML=state.settings.leaveTypes.map(t=>{
      const ok=isEligible(emp,t);
      const why=!ok?(t.sexRestriction&&!emp.sex?' — set sex on profile':` — ${sexWord(t.sexRestriction)} employees only`):'';
      return `<option value="${t.id}" ${ok?'':'disabled'}>${esc(t.name)}${why}</option>`;
    }).join('');
    const stillOk=state.settings.leaveTypes.some(t=>t.id===prev&&isEligible(emp,t));
    const firstOk=state.settings.leaveTypes.find(t=>isEligible(emp,t));
    sel.value=stillOk?prev:(firstOk?firstOk.id:'');
    const st=typeById(sel.value);
    $('#type-note').textContent=st.sexRestriction?`${st.name} is restricted to ${sexWord(st.sexRestriction)} employees.`
      :(emp.sex?'':'Tip: this person\u2019s sex is not set — restricted types stay locked until it is.');
  }
  function syncHoursWrap(){ $('#rq-hours-wrap').style.display=$('#rq-dur').value==='hours'?'':'none'; }
  const upd=()=>{
    syncHoursWrap();
    const f=$('#rq-from').value,tp=typeById($('#rq-type').value),emp=empById($('#rq-emp').value);
    if($('#rq-to').value&&f&&$('#rq-to').value<f)$('#rq-to').value=f;
    const durationType=$('#rq-dur').value;
    const hoursPerDay=parseFloat($('#rq-hours').value)||8;
    const days=computeDays(f,$('#rq-to').value||f,tp,durationType,hoursPerDay);
    $('#pv-days').textContent=fmtDays(days)+(durationType==='hours'?` (${fmtNum(hoursPerDay)}h/day)`:(durationType==='half'?' (half-days)':''));
    let ok=days>=0.5&&emp&&isEligible(emp,tp);
    if(emp){
      const allow=effectiveAllowance(emp,tp,state.settings.year),used=usedDays(emp.id,tp.id),after=allow-used-days;
      const b=$('#pv-bal'); b.textContent=`${fmtNum(after)} of ${fmtNum(allow)}`; b.classList.toggle('neg',after<0);
      const probe={id:'__probe',employeeId:emp.id,from:f,to:$('#rq-to').value};
      const clashes=overlapsOf(probe);
      $('#pv-warn').innerHTML=(after<0?`<div class="warn-strip">⚠ Exceeds remaining ${esc(tp.name)} allowance by ${fmtNum(Math.abs(after))} day(s) — it can still be submitted.</div>`:'')
        +(clashes.length?`<div class="warn-strip">⚠ Overlaps existing: ${clashes.map(c=>`${esc(rangeLabel(c.from,c.to))} (${typeById(c.typeId).name})`).join(', ')}</div>`:'');
    }
    $('#rq-submit').disabled=!ok; $('#rq-submit').style.opacity=ok?1:.45;
  };
  $('#rq-emp').addEventListener('change',()=>{refreshTypeOptions();upd()});
  ['rq-type','rq-from','rq-to','rq-dur','rq-hours'].forEach(id=>$('#'+id).addEventListener('change',upd));
  refreshTypeOptions(); upd();

  $('#rqForm').addEventListener('submit',e=>{
    e.preventDefault();
    const f=$('#rq-from').value,to=$('#rq-to').value,tp=typeById($('#rq-type').value),emp=empById($('#rq-emp').value);
    if(!pool.some(x=>x.id===emp.id)){toast('You can\u2019t request on behalf of this person.','err');return}
    if(!isEligible(emp,tp)){toast(`${esc(tp.name)} isn\u2019t available for this employee.`,'err');return}
    const durationType=$('#rq-dur').value;
    const hoursPerDay=durationType==='hours'?(parseFloat($('#rq-hours').value)||8):8;
    const days=computeDays(f,to,tp,durationType,hoursPerDay);
    if(days<0.5){toast('That range contains no working time.','err');return}
    const reason=$('#rq-reason').value.trim();
    const file=$('#rq-file').files[0];
    const push=(atts)=>{
      const req={id:uid(),employeeId:emp.id,typeId:tp.id,from:f,to:to,days,durationType,hoursPerDay,reason,status:'pending',createdAt:today(),decidedAt:null,note:'',attachments:atts||[]};
      state.requests.push(req);
      logAudit('submit_request',emp.id,null,{typeId:tp.id,from:f,to:to,days,durationType});
      save(); closeModal(); renderAll();
      toast(`Request submitted — ${fmtDays(days)}, pending approval.`,'ok');
    };
    if(file){
      if(file.size>2*1024*1024){toast('Attachment exceeds the 2 MB limit.','err');return}
      const rd=new FileReader();
      rd.onload=()=>push([{name:file.name,type:file.type,size:file.size,data:rd.result}]);
      rd.onerror=()=>toast('Could not read the file.','err');
      rd.readAsDataURL(file);
    } else push([]);
  });
}

function decideModal(id,action){
  const me=currentUser();
  const r=state.requests.find(x=>x.id===id); if(!r)return;
  if(!canApprove(me,r)){toast('You don\u2019t have permission to decide this request.','err');return}
  const e=empById(r.employeeId),tp=typeById(r.typeId);
  const allow=e?effectiveAllowance(e,tp,state.settings.year):0, used=e?usedDays(e.id,r.typeId):0, after=allow-used-r.days;
  const approve=action==='approve', mm=mismatch(e,tp);
  const deleg=viaDelegation(me,r)?'<span class="chip deleg" style="margin-left:6px">delegated approval</span>':'';
  openModal(`<h3>${approve?'Approve':'Reject'} this request?</h3>
    <p class="msub">${e?esc(e.name):'—'}${e&&e.sex?` (${sexLabel(e.sex)})`:''} · ${esc(tp.name)} · ${rangeLabel(r.from,r.to)} · ${fmtDays(r.days)}${deleg}</p>
    ${approve?`<div class="prev-box"><div class="prev-grid"><div><span class="klabel">Balance after</span>
      <b class="${after<0?'neg':''}">${fmtNum(after)} of ${fmtNum(allow)}</b></div></div>
      ${mm?`<div class="warn-strip">⚠ ${esc(tp.name)} is restricted to ${sexWord(tp.sexRestriction)} employees — this profile says ${e.sex?sexLabel(e.sex).toLowerCase():'sex not set'}.</div>`
        :(after<0?`<div class="warn-strip">⚠ This exceeds the remaining allowance by ${fmtNum(Math.abs(after))} day(s).</div>`:`<div class="ok-strip">✓ Within allowance.</div>`)}</div>`:''}
    <div class="field" style="margin-top:14px"><label>Note ${approve?'(optional)':''}</label><textarea id="dc-note" rows="2" placeholder="${approve?'e.g. Enjoy the break!':'Give a reason…'}"></textarea></div>
    <div class="mactions"><button class="btn" id="dc-cancel">Cancel</button>
      <button class="btn ${approve?'btn-ink':'btn-reject-solid'}" id="dc-ok">${approve?'Approve':'Reject'}</button></div>`,
    false,()=>decideModal(id,action));
  $('#dc-cancel').onclick=closeModal;
  $('#dc-ok').onclick=()=>{
    const before={status:r.status};
    r.status=approve?'approved':'rejected';
    r.decidedAt=today(); r.note=$('#dc-note').value.trim();
    logAudit(approve?'approve_request':'reject_request',r.employeeId,before,{status:r.status,requestId:r.id},`${typeById(r.typeId).name} ${rangeLabel(r.from,r.to)}`);
    save(); closeModal(); renderAll();
    toast(`${approve?'Approved':'Rejected'} — ${e?esc(e.name):''} · ${esc(tp.name)}`,approve?'ok':'');
  };
}

function openEmpModal(id){
  const me=currentUser();
  if(me.role!=='hr'){toast('Only HR can edit profiles.','err');return}
  const e=id?empById(id):null;
  const ovr=state.settings.leaveTypes.map(tp=>{
    const val=e&&e.overrides&&e.overrides[tp.id]!=null?e.overrides[tp.id]:'';
    return `<div class="field" style="margin-bottom:8px"><label>${esc(tp.name)} <span style="text-transform:none;letter-spacing:0">(blank = ${tp.allowance})</span></label>
      <input type="number" min="0" data-ovr="${tp.id}" value="${val}" placeholder="${tp.allowance}"></div>`;
  }).join('');
  const mgrs=state.employees.filter(x=>['manager','hr'].includes(x.role)&&x.id!==(e?e.id:''));
  openModal(`<h3>${e?'Edit':'Add'} person</h3><p class="msub">${e?'Adjust profile, role, reporting line, delegation and sign-in.':'Add a teammate — set a username &amp; password to give them sign-in access.'}</p>
    <form id="empForm">
      <div class="mrow">
        <div class="field" style="flex:2"><label>Full name *</label><input id="em-name" required value="${e?esc(e.name):''}"></div>
        <div class="field"><label>Status</label><select id="em-status">
          <option value="active" ${!e||e.status==='active'?'selected':''}>Active</option>
          <option value="left" ${e&&e.status==='left'?'selected':''}>Left company</option></select></div>
      </div>
      <div class="mrow">
        <div class="field"><label>Job title</label><input id="em-role" value="${e?esc(e.roleTitle||''):''}"></div>
        <div class="field"><label>Department</label><input id="em-dept" value="${e?esc(e.department||''):''}"></div>
        <div class="field"><label>Sex</label><select id="em-sex">
          <option value="" ${!e||!e.sex?'selected':''}>Not specified</option>
          <option value="female" ${e&&e.sex==='female'?'selected':''}>Female</option>
          <option value="male" ${e&&e.sex==='male'?'selected':''}>Male</option></select></div>
      </div>
      <div class="mrow">
        <div class="field"><label>Email</label><input id="em-email" type="email" value="${e?esc(e.email||''):''}"></div>
        <div class="field"><label>Joined</label><input id="em-joined" type="date" value="${e?(e.joined||''):''}"></div>
      </div>
      <span class="klabel" style="display:block;margin:6px 0 10px">Role, reporting &amp; delegation</span>
      <div class="mrow">
        <div class="field"><label>System role</label><select id="em-sysrole">
          <option value="employee" ${!e||e.role==='employee'?'selected':''}>Employee — requests leave</option>
          <option value="manager" ${e&&e.role==='manager'?'selected':''}>Manager — approves their reports</option>
          <option value="hr" ${e&&e.role==='hr'?'selected':''}>HR — full administration</option></select></div>
        <div class="field"><label>Reports to (manager)</label><select id="em-mgr"><option value="">— none (HR decides) —</option>
          ${mgrs.map(m=>`<option value="${m.id}" ${e&&e.managerId===m.id?'selected':''}>${esc(m.name)} (${roleLabel(m.role)})</option>`).join('')}</select></div>
        <div class="field"><label>Delegate approver <span style="text-transform:none;letter-spacing:0">(when manager away)</span></label><select id="em-delegate"><option value="">— none —</option>
          ${mgrs.map(m=>`<option value="${m.id}" ${e&&e.delegateManagerId===m.id?'selected':''}>${esc(m.name)} (${roleLabel(m.role)})</option>`).join('')}</select></div>
      </div>
      <span class="klabel" style="display:block;margin:6px 0 10px">Sign-in</span>
      <div class="mrow">
        <div class="field"><label>Username</label><input id="em-user" autocomplete="off" placeholder="leave blank for no sign-in" value="${e?esc(e.username||''):''}"></div>
        <div class="field"><label>${e?'New password (blank = keep)':'Password'}</label><input id="em-pw" type="password" autocomplete="new-password" placeholder="${e?'••••••':'required if username set'}"></div>
      </div>
      <span class="klabel" style="display:block;margin:6px 0 10px">Allowance overrides (days / year)</span>
      <div class="ovr-grid" style="margin-top:2px">${ovr}</div>
      <div class="mactions"><button type="button" class="btn" id="em-cancel">Cancel</button>
        <button type="submit" class="btn btn-primary">${e?'Save changes':'Add person'}</button></div>
    </form>`,false,()=>openEmpModal(id));
  $('#em-cancel').onclick=closeModal;
  $('#empForm').addEventListener('submit',ev=>{
    ev.preventDefault();
    const name=$('#em-name').value.trim(); if(!name)return;
    const username=$('#em-user').value.trim().toLowerCase();
    const sysrole=$('#em-sysrole').value, managerId=$('#em-mgr').value||null, delegateManagerId=$('#em-delegate').value||null, pw=$('#em-pw').value;
    if(username&&state.employees.some(x=>x.username===username&&x.id!==(e?e.id:''))){toast('That username is already taken.','err');return}
    if(username&&!pw&&(!e||!e.pwHash)){toast('Set an initial password for this account.','err');return}
    if(managerId===delegateManagerId&&managerId){toast('Delegate must be different from the primary manager.','err');return}
    if(e&&e.id===me.id&&(sysrole!=='hr'||!username)&&!state.employees.some(x=>x.role==='hr'&&x.id!==e.id)){
      toast('You\u2019re the only HR admin — promote someone else before changing your own access.','err');return}
    const overrides={};
    $$('[data-ovr]').forEach(inp=>{if(inp.value!=='')overrides[inp.dataset.ovr]=Math.max(0,Number(inp.value)||0)});
    const data={name,sex:$('#em-sex').value,roleTitle:$('#em-role').value.trim(),department:$('#em-dept').value.trim(),
      email:$('#em-email').value.trim(),joined:$('#em-joined').value,status:$('#em-status').value,
      role:sysrole,managerId,delegateManagerId,username,overrides};
    const before=e?clone({name:e.name,role:e.role,managerId:e.managerId,delegateManagerId:e.delegateManagerId,department:e.department,username:e.username,status:e.status}):null;
    if(e){
      Object.assign(e,data);
      if(!username){e.pwHash='';e.pwSalt=''} else if(pw)setPassword(e,pw);
      logAudit('edit_employee',e.id,before,{name:data.name,role:data.role,managerId:data.managerId,delegateManagerId:data.delegateManagerId,username:data.username});
    }else{
      const ne={id:uid(),pwHash:'',pwSalt:'',...data};
      if(username)setPassword(ne,pw);
      state.employees.push(ne);
      logAudit('add_employee',ne.id,null,{name:ne.name,role:ne.role,department:ne.department});
    }
    save(); closeModal(); renderAll(); toast(`${e?'Saved':'Added'} — ${esc(name)}`,'ok');
  });
}

document.addEventListener('click',e=>{
  const th=e.target.closest('[data-settheme]'); if(th){applyTheme(th.dataset.settheme);return}
  if(e.target.closest('[data-logout]')){clearSession();renderRoot();toast('Signed out.');return}
  if(e.target.closest('[data-about]')){openAboutModal();return}
  if(e.target.closest('[data-resetpw]')){resetDemoPasswords();return}
  const tab=e.target.closest('#nav [data-tab]'); if(tab){setTab(tab.dataset.tab);return}
  if(e.target.closest('#btnNewRequest')){const me=currentUser();if(!me)return;
    me.role==='hr'?openRequestModal():openRequestModal({empId:me.id,lock:true});return}
  if(e.target.closest('#btnExport')){exportJSON();return}
  if(e.target.closest('#btnImport')){$('#fileImport').click();return}
  if(e.target.id==='overlay'){closeModal();return}
  if(e.target.closest('[data-myreq]')){const me=currentUser();if(me)openRequestModal({empId:me.id,lock:true});return}

  const att=e.target.closest('[data-att]'); if(att){openAttachmentsModal(att.dataset.att);return}

  const tl=e.target.closest('[data-tile]'); if(tl){tileAction(tl.dataset.tile);return}
  const pr=e.target.closest('[data-profile]');
  if(pr&&!e.target.closest('.icon-btn')){openProfileModal(pr.dataset.profile);return}

  const ap=e.target.closest('[data-approve]'); if(ap){decideModal(ap.dataset.approve,'approve');return}
  const rj=e.target.closest('[data-reject]'); if(rj){decideModal(rj.dataset.reject,'reject');return}
  const ro=e.target.closest('[data-reopen]');
  if(ro){const me=currentUser();if(me.role!=='hr'){toast('Only HR can reopen decisions.','err');return}
    const r=state.requests.find(x=>x.id===ro.dataset.reopen);
    if(r){r.status='pending';r.decidedAt=null;r.note='';logAudit('reopen_request',r.employeeId,null,{requestId:r.id});save();renderAll();toast('Reopened as pending.')}return}
  const cr=e.target.closest('[data-cancelreq]');
  if(cr){const me=currentUser();const r=state.requests.find(x=>x.id===cr.dataset.cancelreq);
    if(r&&me&&(me.role==='hr'||(r.employeeId===me.id&&r.status==='pending'))){
      confirmModal('Cancel this request?','The pending request will be removed.','Cancel request',()=>{
        logAudit('cancel_request',r.employeeId,{requestId:r.id},null);
        state.requests=state.requests.filter(x=>x.id!==r.id);save();renderAll();toast('Request cancelled.')});}
    return}
  const dr=e.target.closest('[data-delreq]');
  if(dr){const me=currentUser();if(me.role!=='hr'){toast('Only HR can delete requests.','err');return}
    const r=state.requests.find(x=>x.id===dr.dataset.delreq);
    confirmModal('Delete this request?','This removes the request permanently. The days return to the employee\u2019s balance.','Delete',()=>{
      logAudit('delete_request',r.employeeId,{requestId:r.id,typeId:r.typeId,from:r.from,to:r.to,days:r.days},null);
      state.requests=state.requests.filter(x=>x.id!==r.id);save();renderAll();toast('Request deleted.')});return}

  const ne=e.target.closest('[data-newemp]'); if(ne){openEmpModal();return}
  const ee=e.target.closest('[data-editemp]'); if(ee){openEmpModal(ee.dataset.editemp);return}
  const de=e.target.closest('[data-delemp]');
  if(de){const me=currentUser();const emp=empById(de.dataset.delemp);
    if(emp.id===me.id){toast('You can\u2019t remove your own account.','err');return}
    if(emp.role==='hr'&&!state.employees.some(x=>x.role==='hr'&&x.id!==emp.id)){toast('That\u2019s the only HR admin — promote someone else first.','err');return}
    const n=state.requests.filter(r=>r.employeeId===emp.id).length;
    confirmModal(`Remove ${emp.name}?`,`${n} request${n===1?'':'s'} will also be deleted. Their sign-in account stops working immediately.`,'Remove',()=>{
      logAudit('delete_employee',emp.id,{name:emp.name,role:emp.role,department:emp.department},null);
      state.employees=state.employees.filter(x=>x.id!==emp.id);
      state.requests=state.requests.filter(r=>r.employeeId!==emp.id);
      save();renderAll();toast(`${esc(emp.name)} removed.`)});return}

  const fc=e.target.closest('[data-rfilter]'); if(fc){ui.filter=fc.dataset.rfilter;renderRequests();revealActive();return}
  const cn=e.target.closest('[data-cal]');
  if(cn){const v=+cn.dataset.cal;
    if(v===0){ui.month=new Date();ui.month.setDate(1)}
    else ui.month=new Date(ui.month.getFullYear(),ui.month.getMonth()+v,1);
    renderCalendar();revealActive();return}

  const addhol=e.target.closest('[data-addhol]');
  if(addhol){const d=$('#hol-date').value, n=$('#hol-name').value.trim();
    if(!d){toast('Pick a date for the holiday.','err');return}
    if(!n){toast('Give the holiday a name.','err');return}
    if(state.settings.holidays.some(h=>h.date===d)){toast('That date is already a holiday.','err');return}
    state.settings.holidays.push({id:uid(),date:d,name:n});
    state.settings.holidays.sort((a,b)=>a.date.localeCompare(b.date));
    logAudit('add_holiday',null,null,{date:d,name:n});
    save();renderSettings();revealActive();toast('Holiday added — day calculations updated.','ok');return}
  const delhol=e.target.closest('[data-delhol]');
  if(delhol){const h=state.settings.holidays.find(x=>x.id===delhol.dataset.delhol);
    state.settings.holidays=state.settings.holidays.filter(x=>x.id!==delhol.dataset.delhol);
    logAudit('delete_holiday',null,h,null);
    save();renderSettings();revealActive();toast('Holiday removed.');return}

  const dot=e.target.closest('[data-cycledot]');
  if(dot){const row=dot.closest('[data-type]'),tp=state.settings.leaveTypes.find(t=>t.id===row.dataset.type);
    if(tp){tp.color=PALETTE[(Math.max(0,PALETTE.indexOf(tp.color))+1)%PALETTE.length];dot.style.background=tp.color;logAudit('edit_leavetype',tp.id,null,{color:tp.color});save()}return}
  const dt=e.target.closest('[data-deltype]');
  if(dt){const tp=typeById(dt.dataset.deltype); const used=state.requests.filter(r=>r.typeId===tp.id).length;
    const go=()=>{state.settings.leaveTypes=state.settings.leaveTypes.filter(t=>t.id!==tp.id);logAudit('delete_leavetype',null,{name:tp.name},null);save();renderSettings();revealActive();toast('Leave type removed.')};
    used?confirmModal(`Remove “${tp.name}”?`,`${used} request${used===1?'':'s'} use this type — they\u2019ll show as <i>(removed type)</i>.`,'Remove anyway',go):go();
    return}
  const at=e.target.closest('[data-addtype]');
  if(at){const nt={id:uid(),name:'New leave',color:PALETTE[state.settings.leaveTypes.length%PALETTE.length],allowance:5,countsWeekends:false,sexRestriction:null,accrualRate:'annual',carryoverCap:0,proRateFromJoinDate:false};
    state.settings.leaveTypes.push(nt);logAudit('add_leavetype',null,null,{name:nt.name});
    save();renderSettings();revealActive();return}

  const rchip=e.target.closest('[data-report]');
  if(rchip){ui.report=rchip.dataset.report;renderReports();revealActive();return}
  const rcsv=e.target.closest('[data-rpt-csv]');
  if(rcsv){const me=currentUser();if(me)exportReportCSV(rcsv.dataset.rptCsv,me);return}
  const rprint=e.target.closest('[data-rpt-print]');
  if(rprint){exportPDF();return}

  const act=e.target.closest('[data-act]');
  if(act){const a=act.dataset.act;
    if(a==='export')exportJSON();
    if(a==='import')$('#fileImport').click();
    if(a==='resetpw')resetDemoPasswords();
    if(a==='sample')confirmModal('Load sample workspace?','Replaces current data with a demo team and requests, and signs you out.','Load sample',()=>{state=seedSample();save();clearSession();renderRoot();toast('Sample workspace loaded.','ok')});
    if(a==='fresh')confirmModal('Start fresh?','Clears all people, requests, accounts, holidays and settings. Export a backup first if you need one.','Clear everything',()=>{
      state={settings:defaultSettings(),employees:[],requests:[],audit:[]};save();clearSession();renderRoot();toast('Workspace cleared.')});
  }
});

document.addEventListener('change',e=>{
  if(e.target.id==='set-company'){const before=state.settings.companyName;state.settings.companyName=e.target.value.trim()||'Untitled';logAudit('edit_settings',null,{companyName:before},{companyName:state.settings.companyName});save();renderTopbar();return}
  if(e.target.id==='set-year'){const before=state.settings.year;state.settings.year=Math.max(2000,Math.min(2100,Number(e.target.value)||new Date().getFullYear()));logAudit('edit_settings',null,{year:before},{year:state.settings.year});save();renderTopbar();toast('Leave year updated.');return}
  if(e.target.id==='set-wsm'){state.settings.weekStartsMonday=e.target.checked;logAudit('edit_settings',null,null,{weekStartsMonday:e.target.checked});save();return}
  if(e.target.id==='rpt-scope'){ui.reportScope=e.target.value;renderReports();revealActive();return}
  if(e.target.id==='audit-filter'){ui.auditFilter=e.target.value;renderAuditBody();return}
  if(e.target.id==='audit-search'){ui.auditSearch=e.target.value;renderAuditBody();return}
  const row=e.target.closest('[data-type]');
  if(row){const tp=state.settings.leaveTypes.find(t=>t.id===row.dataset.type); if(!tp)return;
    if(e.target.classList.contains('tname')){tp.name=e.target.value.trim()||'Untitled';logAudit('edit_leavetype',tp.id,null,{name:tp.name});}
    if(e.target.classList.contains('tnum')){tp.allowance=Math.max(0,Number(e.target.value)||0);logAudit('edit_leavetype',tp.id,null,{allowance:tp.allowance});}
    if(e.target.classList.contains('twdc')){tp.countsWeekends=e.target.checked;logAudit('edit_leavetype',tp.id,null,{countsWeekends:tp.countsWeekends});}
    if(e.target.classList.contains('tres')&&!e.target.classList.contains('taccr')){tp.sexRestriction=e.target.value||null;logAudit('edit_leavetype',tp.id,null,{sexRestriction:tp.sexRestriction});}
    if(e.target.classList.contains('taccr')){tp.accrualRate=e.target.value;logAudit('edit_leavetype',tp.id,null,{accrualRate:tp.accrualRate});}
    if(e.target.classList.contains('tcarry')){tp.carryoverCap=Math.max(0,Number(e.target.value)||0);logAudit('edit_leavetype',tp.id,null,{carryoverCap:tp.carryoverCap});}
    if(e.target.classList.contains('tpro')){tp.proRateFromJoinDate=e.target.checked;logAudit('edit_leavetype',tp.id,null,{proRateFromJoinDate:tp.proRateFromJoinDate});}
    save();}
});

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeModal();return}
  if(e.key==='Enter'&&e.target.closest&&e.target.closest('[data-tile]')){
    tileAction(e.target.closest('[data-tile]').dataset.tile);
  }
});

$('#fileImport').addEventListener('change',e=>{handleImportFile(e.target.files[0]);e.target.value=''});
window.addEventListener('resize',moveIndicator);

let dragDepth=0;
window.addEventListener('dragenter',e=>{e.preventDefault();dragDepth++;$('#dropzone').classList.add('on')});
window.addEventListener('dragover',e=>e.preventDefault());
window.addEventListener('dragleave',e=>{e.preventDefault();if(--dragDepth<=0){dragDepth=0;$('#dropzone').classList.remove('on')}});
window.addEventListener('drop',e=>{
  e.preventDefault();dragDepth=0;$('#dropzone').classList.remove('on');
  const me=currentUser();
  if(!me||me.role!=='hr'){toast('Sign in as HR to import files.','err');return}
  const f=e.dataTransfer.files[0];
  if(f&&/\.json$/i.test(f.name))handleImportFile(f); else toast('Please drop a .json file.','err');
});

(function init(){
  let raw=null;
  try{raw=localStorage.getItem(LS_KEY)}catch(e){}
  if(raw){state=normalize(JSON.parse(raw))}
  else{state=seedSample();save();
    setTimeout(()=>toast(`Sample workspace loaded — sign in with the demo accounts (password: ${DEMO_PASSWORD}).`,'ok',6000),400)}
  renderRoot();
})();
</script>
</body>
</html>
